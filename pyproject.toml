[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "status-page-gen"
version = "1.0.0"
description = "Static status page generator for cron: HTTP, TCP and TLS-expiry checks, 90-day uptime bars, Markdown incidents, JSON and Atom feeds. No JavaScript."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Marvin Palencia"}]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["status page", "uptime", "monitoring", "static site", "cron", "tls", "atom"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: System :: Monitoring"]

[project.urls]
Homepage = "https://github.com/dreadmoreeee/status-page-gen"
Author = "https://marvin.demarkstudio.ca"

[project.scripts]
status-page-gen = "status_page_gen.cli:main"

[tool.setuptools]
packages = ["status_page_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
